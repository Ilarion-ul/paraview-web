<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ParaView VTK.js Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgb(98, 93, 90);
    }

    #status {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 10;
      padding: 8px 10px;
      background: rgba(255,255,255,0.85);
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #111;
    }
  </style>
</head>
<body>
  <div id="status">Loading scene...</div>

  <script type="importmap">
  {
    "imports": {
      "@kitware/vtk.js/": "https://esm.sh/@kitware/vtk.js/"
    }
  }
  </script>

  <script type="module">
    import '@kitware/vtk.js/Rendering/Profiles/All';
    import '@kitware/vtk.js/IO/Core/DataAccessHelper/HttpDataAccessHelper';

    import vtkFullScreenRenderWindow from '@kitware/vtk.js/Rendering/Misc/FullScreenRenderWindow';
    import vtkHttpSceneLoader from '@kitware/vtk.js/IO/Core/HttpSceneLoader';

    const status = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);

    const sceneUrl = params.get('url') || 'Tor.vtkjs.0/index.json';

    const fullScreenRenderer = vtkFullScreenRenderWindow.newInstance({
      background: [0.384314, 0.364706, 0.352941],
    });

    const renderer = fullScreenRenderer.getRenderer();
    const renderWindow = fullScreenRenderer.getRenderWindow();

    const sceneImporter = vtkHttpSceneLoader.newInstance({
      renderer,
      fetchGzip: true,
    });

    sceneImporter.onReady(() => {
      status.textContent = 'Scene loaded. Drag to rotate, scroll to zoom.';
      setTimeout(() => status.remove(), 2500);

      renderer.resetCamera();
      renderWindow.render();
    });

    try {
      sceneImporter.setUrl(sceneUrl);
    } catch (error) {
      status.textContent = 'Error loading scene. Open DevTools Console.';
      console.error(error);
    }

    window.addEventListener('dblclick', () => {
      sceneImporter.resetScene();
      renderWindow.render();
    });
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ParaView VTK.js Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgb(98, 93, 90);
    }

    #status {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 10;
      padding: 8px 10px;
      background: rgba(255,255,255,0.85);
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #111;
    }
  </style>
</head>

<body>
  <div id="status">Loading scene...</div>

  <script src="https://unpkg.com/vtk.js@34.10.0/vtk.js"></script>

  <script>
    const status = document.getElementById('status');

    const params = new URLSearchParams(window.location.search);
    const sceneUrl = params.get('url') || 'Tor.vtkjs.0/index.json';

    if (!window.vtk) {
      status.textContent = 'vtk.js was not loaded.';
      throw new Error('vtk.js was not loaded');
    }

    const vtkFullScreenRenderWindow =
      vtk.Rendering.Misc.vtkFullScreenRenderWindow;

    const vtkHttpSceneLoader =
      vtk.IO.Core.vtkHttpSceneLoader;

    if (!vtkHttpSceneLoader) {
      status.textContent = 'vtkHttpSceneLoader was not found in vtk.js bundle.';
      throw new Error('vtkHttpSceneLoader was not found');
    }

    const fullScreenRenderer = vtkFullScreenRenderWindow.newInstance({
      background: [0.384314, 0.364706, 0.352941],
    });

    const renderer = fullScreenRenderer.getRenderer();
    const renderWindow = fullScreenRenderer.getRenderWindow();

    const sceneImporter = vtkHttpSceneLoader.newInstance({
      renderer: renderer,
      fetchGzip: true,
    });

    sceneImporter.onReady(function () {
      renderer.resetCamera();
      renderWindow.render();

      status.textContent = 'Scene loaded. Drag to rotate, scroll to zoom.';
      setTimeout(function () {
        status.remove();
      }, 2500);
    });

    sceneImporter.setUrl(sceneUrl);

    window.addEventListener('dblclick', function () {
      sceneImporter.resetScene();
      renderer.resetCamera();
      renderWindow.render();
    });
  </script>
</body>
</html>
